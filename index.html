<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">📋 TaskFlow</span>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal">
        + Ajouter
      </button>
    </div>
  </nav>

  <main class="container my-4">
    <div class="row g-3">
      <div class="col-md-4">
        <h5 class="column-title">À faire</h5>
        <div class="task-list" id="todo"></div>
      </div>
      <div class="col-md-4">
        <h5 class="column-title">En cours</h5>
        <div class="task-list" id="doing"></div>
      </div>
      <div class="col-md-4">
        <h5 class="column-title">Terminé</h5>
        <div class="task-list" id="done"></div>
      </div>
    </div>
  </main>

  <!-- Modal ajout tâche -->
  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nouvelle tâche</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="text" id="taskTitle" class="form-control mb-2" placeholder="Titre">
          <textarea id="taskDesc" class="form-control mb-2" placeholder="Description"></textarea>
          <select id="taskPriority" class="form-select">
            <option value="low">Priorité basse</option>
            <option value="medium">Priorité moyenne</option>
            <option value="high">Priorité haute</option>
          </select>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
          <button class="btn btn-primary" id="saveTask">Enregistrer</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
